<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - UKTTBS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="loading">

  <div class="preloader"><div class="counter">0%</div></div>
  <div class="film-grain"></div>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>

  <nav class="navbar fade-in">
    <div class="logo"><a href="index.html" class="magnetic">UKTTBS.</a></div>
    <div class="menu-toggle magnetic" aria-label="Toggle menu">
      <div class="hamburger"><span></span><span></span></div>
    </div>
  </nav>

  <div class="menu-overlay">
    <div class="menu-bg"></div>
    <div class="menu-inner">
      <ul class="nav-links">
        <li><a href="about.html" class="magnetic" data-img="panel1.png"><span class="nav-num">01</span> Our History</a></li>
        <li><a href="mission.html" class="magnetic" data-img="panel2.png"><span class="nav-num">02</span> The Trade</a></li>
        <li><a href="ethics.html" class="magnetic" data-img="panel3.png"><span class="nav-num">03</span> Ethics</a></li>
        <li><a href="events.html" class="magnetic" data-img="panel4.png"><span class="nav-num">04</span> Events</a></li>
        <li><a href="team.html" class="magnetic" data-img="panel5.png"><span class="nav-num">05</span> The Team</a></li>
        <li><a href="100-club.html" class="magnetic" data-img="club_cheers.png"><span class="nav-num">06</span> 100 Club</a></li>
      </ul>
      <div class="nav-footer">
        <a href="account.html" class="magnetic">My Account</a>
        <a href="mailto:info@ukttbs.co.uk" class="magnetic">Get in Touch</a>
      </div>
    </div>
  </div>

  <main>
    <section class="hero" style="height: 100vh;">
      <div class="hero-bg" style="background-image: url('club_cheers.png');"></div>
      <div class="hero-content">
        <span class="fade-in" style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #c9a96e; letter-spacing: 0.15em; text-transform: uppercase; display: block; margin-bottom: 2rem; opacity: 0; transform: translateY(20px);">Confirmation</span>
        <h1 class="hero-title" style="margin-bottom: 2rem;">
          <div class="line" style="overflow: visible;"><span class="hero-word" id="heading" style="font-size: clamp(2.5rem, 7vw, 6rem); white-space: nowrap;">Payment received.</span></div>
        </h1>
        <p id="body" class="fade-in" style="font-size: 1.15rem; font-weight: 300; color: rgba(255,255,255,0.65); max-width: 550px; margin: 0 auto; line-height: 1.7; opacity: 0; transform: translateY(20px);">
          A confirmation is on its way to your inbox. You can view everything in your account area whenever you need it.
        </p>
        <div class="fade-in" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 3rem; opacity: 0; transform: translateY(20px);">
          <a href="account.html" class="magnetic" style="border: 1px solid #fff; padding: 1rem 2.5rem; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.1em; color: #000; background: #fff; font-size: 0.85rem; font-weight: 600;">My Account</a>
          <a href="index.html" class="magnetic" style="border: 1px solid rgba(255,255,255,0.25); padding: 1rem 2.5rem; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.1em; color: #fff; font-size: 0.85rem; transition: background 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">Back to home</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="app.js"></script>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
  <script>
    const kind = new URLSearchParams(location.search).get("kind");
    const titles = {
      tickets:      ["You're in — see you there!", "Your event tickets are confirmed. We'll email them to you shortly. Please bring your confirmation on the night."],
      raffle:       ["Good luck!", "Your raffle tickets are in the draw. Winners will be contacted after the event — best of luck!"],
      hundred_club: ["Welcome to the 100 Club!", "Your subscription is active. You'll be entered into every monthly draw from here on. Thank you for supporting the Society."],
    };
    if (kind && titles[kind]) {
      document.getElementById("heading").textContent = titles[kind][0];
      document.getElementById("body").textContent = titles[kind][1];
    }
  </script>
</body>
</html>
